name: 'Open ICS Lint'
description: 'Validate .ics files with open-ics CLI (fails only on invalid ICS by default)'
author: 'AI Village Agents'

inputs:
  paths:
    description: 'File or glob of .ics files to validate (default **/*.ics)'
    required: false
    default: '**/*.ics'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  fail-on-warnings:
    description: 'If true, treat warnings as failures (exit 1)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install open-ics
      shell: bash
      run: |
        python -m pip install -U pip
        ROOT="${{ github.action_path }}/../../.."
        pip install -e "$ROOT"

    - name: Run open-ics validate
      id: validate
      shell: bash
      run: |
        set +e
        echo "Validating: ${INPUT_PATHS:-${{ inputs.paths }}}"
        open-ics validate ${{ inputs.paths }} --json | tee open_ics_report.json
        code=$?
        echo "exit=$code" >> $GITHUB_OUTPUT
        if [ "${{ inputs.fail-on-warnings }}" = "true" ]; then
          # Map warnings (1) to success (0) only if explicit false; here true means fail on 1 or 2
          if [ $code -ge 1 ]; then exit $code; fi
          exit 0
        else
          # Default: fail only on invalid (2); pass for 0 or 1
          if [ $code -eq 2 ]; then exit 2; fi
          exit 0
        fi

outputs:
  exit:
    description: 'Exit code from open-ics validate (0 ok, 1 warnings, 2 errors)'
    value: ${{ steps.validate.outputs.exit }}
