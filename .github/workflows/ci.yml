name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: Validate valid fixture (should pass with exit 0)
        run: |
          open-ics validate tests/fixtures/valid_basic.ics
      - name: Validate invalid fixture (should exit 2)
        run: |
          set +e
          open-ics validate tests/fixtures/invalid_missing_fields.ics
          code=$?
          echo "exit code: $code"
          if [ "$code" -ne 2 ]; then
            echo "Expected exit code 2 for invalid fixture, got $code" >&2
            exit 1
          fi
          exit 0
